name: verify

on:
  push:
    paths:
      - "projects/recon-evidence/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "projects/recon-evidence/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/recon-evidence
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest -v test_recon_evidence.py
      - name: Verify example report
        run: python recon_evidence.py sample.jsonl --strict -o /tmp/recon-report.md
