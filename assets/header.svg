<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">MEZ111 security engineering banner</title>
  <desc id="desc">Dark technical banner with a command line motif and green signal paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120f"/>
      <stop offset="0.55" stop-color="#0b1d18"/>
      <stop offset="1" stop-color="#102720"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a7f3d0" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <path d="M0 270H260L300 230H510L550 270H760L800 208H990L1040 270H1200" fill="none" stroke="url(#line)" stroke-width="2"/>
  <circle cx="800" cy="208" r="5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="300" cy="230" r="5" fill="#34d399" filter="url(#glow)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="74" y="82" fill="#6ee7b7" font-size="18" letter-spacing="4">SECURITY / AUTOMATION / SYSTEMS</text>
    <text x="70" y="171" fill="#ecfdf5" font-size="72" font-weight="700" letter-spacing="2">MEZ111</text>
    <text x="74" y="215" fill="#a7f3d0" font-size="22">build evidence. reduce noise. ship clearly.</text>
    <g transform="translate(885 58)">
      <rect width="245" height="104" rx="12" fill="#04100c" stroke="#34d399" stroke-opacity=".45"/>
      <circle cx="22" cy="20" r="4" fill="#34d399"/>
      <circle cx="38" cy="20" r="4" fill="#14532d"/>
      <circle cx="54" cy="20" r="4" fill="#14532d"/>
      <text x="18" y="56" fill="#6ee7b7" font-size="14">$ verify --scope</text>
      <text x="18" y="80" fill="#d1fae5" font-size="14">status: reproducible</text>
    </g>
  </g>
</svg>
